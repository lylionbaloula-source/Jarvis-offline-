name: Construire Jarvis Offline APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Integrer le modele vocal francais
        run: |
          curl -fL --retry 3 https://alphacephei.com/vosk/models/vosk-model-small-fr-0.22.zip -o /tmp/model.zip
          unzip -q /tmp/model.zip -d /tmp/vosk
          mkdir -p app/src/main/assets
          mv /tmp/vosk/vosk-model-small-fr-0.22 app/src/main/assets/model-fr
          echo fr-0.22 > app/src/main/assets/model-fr/uuid
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Offline-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
